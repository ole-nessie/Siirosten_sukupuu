  });
  // Drag & drop
  document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
  document.body.addEventListener('drop', async (e) => {
    e.preventDefault();
    const f = e.dataTransfer.files[0]; if (!f) return;
    if (await maybeDiscard() === false) return;
    const text = await f.text();
    loadXml(text, f.name);
  });
  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const isMod = e.metaKey || e.ctrlKey;
    if (isMod && !e.shiftKey && e.key.toLowerCase()==='o'){ e.preventDefault(); openFile(); }
    else if (isMod && !e.shiftKey && e.key.toLowerCase()==='s'){ e.preventDefault(); saveFile(false); }
    else if (isMod && e.shiftKey && e.key.toLowerCase()==='s'){ e.preventDefault(); saveFile(true); }
    else if (isMod && !e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    else if ((isMod && e.shiftKey && e.key.toLowerCase()==='z') || (isMod && e.key.toLowerCase()==='y')){ e.preventDefault(); redo(); }
    else if (isMod && e.key.toLowerCase()==='f'){ e.preventDefault(); document.getElementById('search').focus(); }
  });
  // Unsaved-changes guard
  window.addEventListener('beforeunload', (e) => {
    if (state.dirty){ e.preventDefault(); e.returnValue=''; }
  });
}
function setView(v){
  state.view = v; state._needsFit = true;
  for (const id of ['btn-view-hourglass','btn-view-pedigree','btn-view-desc']) document.getElementById(id).classList.remove('primary');
  if (v==='hourglass') document.getElementById('btn-view-hourglass').classList.add('primary');
  if (v==='pedigree')  document.getElementById('btn-view-pedigree').classList.add('primary');
  if (v==='descendant')document.getElementById('btn-view-desc').classList.add('primary');
  renderTree();
}

function setupSplitter(){
  let editorW = parseInt(localStorage.getItem('editorW') || '420', 10);
  editorW = Math.max(280, Math.min(900, editorW));
  document.documentElement.style.setProperty('--editor-w', editorW + 'px');
  const splitter = document.getElementById('splitter');
  let drag = null;
  splitter.addEventListener('mousedown', (e) => {
    drag = { startX: e.clientX, startW: editorW };
    document.body.style.userSelect = 'none';
    splitter.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    // Editor is on the right; dragging left makes it wider
    const newW = Math.max(280, Math.min(900, drag.startW - (e.clientX - drag.startX)));
    if (newW !== editorW){
      editorW = newW;
      document.documentElement.style.setProperty('--editor-w', editorW + 'px');
    }
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null;
    document.body.style.userSelect = '';
    splitter.classList.remove('dragging');
    localStorage.setItem('editorW', editorW);
    state._needsFit = true;
    renderTree();
  });
  splitter.addEventListener('dblclick', () => {
    editorW = 420;
    document.documentElement.style.setProperty('--editor-w', editorW + 'px');
    localStorage.setItem('editorW', editorW);
    state._needsFit = true;
    renderTree();
  });
}
function init(){
  applyI18n();
  setupSplitter();
  bindToolbar();
  setupSearch();
  setupPanZoom();
  // Mobile sheet: backdrop tap dismisses
  document.getElementById('editor-backdrop').addEventListener('click', hideMobileSheet);
  // Resize handler — also clear sheet state when crossing the mobile/desktop boundary
  window.addEventListener('resize', () => {
    if (!isMobile()) hideMobileSheet();
    state._needsFit = true;
    renderTree();
  });
  // Tweak SVG touch defaults so panning doesn't cause page scroll/zoom
  const svg = document.getElementById('tree-svg');
  if (svg) svg.style.touchAction = 'none';
  render();
}
init();

// Expose for the Electron wrapper
window.__app = {
  loadXml, saveFile, openFile, newFile, undo, redo, state,
  getXmlForSave: () => state.g ? serializeXml(state.g.parsed) : null,
};

// ============================================================================
// ELECTRON BRIDGE (only active when running in Electron)
// ============================================================================
if (window.electronAPI){
  // Override the open/save handlers to use native dialogs
  const api = window.electronAPI;
  // Replace openFile with the native version
  document.getElementById('btn-open').onclick = () => api.open();
  document.getElementById('btn-open-empty').onclick = () => api.open();
  document.getElementById('btn-save').onclick = async () => { const ok = await api.save(); if (ok!==false) markSaved(); };
  document.getElementById('btn-saveas').onclick = async () => { const ok = await api.saveAs(); if (ok!==false) markSaved(); };
  // Listen for file events from main.
  // CRITICAL: set __electronXmlDir BEFORE loadXml so the render() inside loadXml
  // sees a valid dir and actually loads the primary photo on first open.
  api.on('file:loaded', ({name, text, dir}) => {
    window.__electronXmlDir = dir;
    photoCache.clear();
    loadXml(text, name);
    state.fileHandle = { name, dir };
  });
  api.on('file:saved', () => { markSaved(); toast(t('saved')); });
  api.on('menu:new', () => newFile());
  api.on('menu:save', async () => { const ok = await api.save(); if (ok!==false) markSaved(); });
  api.on('menu:saveas', async () => { const ok = await api.saveAs(); if (ok!==false) markSaved(); });
  api.on('photodir:set', (dir) => { window.__electronPhotoBase = dir; photoCache.clear(); renderEditor(); });
  // Notify main about dirty state
  const _origSetDirty = setDirty;
  window.setDirty = setDirty = function(){ _origSetDirty.apply(null, arguments); api.setDirty(state.dirty); };
  // Photo loading override: ask main to find the photo (it knows xmlDir + kuvat fallbacks)
  window.loadPhotos = loadPhotos = async function(){
    if (!window.__electronXmlDir && !window.__electronPhotoBase) return;
    for (const el of document.querySelectorAll('.photo-preview, .primary-photo')){
      const fname = el.getAttribute('data-file'); if (!fname) continue;
      const isPrimary = el.classList.contains('primary-photo');
      const cls = isPrimary ? 'photo-large' : 'photo-thumb';
      const cached = photoCache.get(fname);
      if (cached === '__missing__'){ el.innerHTML = isPrimary ? '' : `<div class="missing-photo">${escapeHtml(t('photoMissing',{file:fname}))}</div>`; continue; }
      if (cached){ el.innerHTML = `<img src="${cached}" class="${cls}">`; continue; }
      const data = await api.readPhoto(fname);
      if (data){
        const url = `data:${data.mime};base64,${data.data}`;
        photoCache.set(fname, url);
        el.innerHTML = `<img src="${url}" class="${cls}">`;
      } else {
        photoCache.set(fname, '__missing__');
        el.innerHTML = isPrimary ? '' : `<div class="missing-photo">${escapeHtml(t('photoMissing',{file:fname}))}</div>`;
      }
    }
  };
  // Keyboard shortcuts already work via menu accelerators; remove our own to avoid double handling
}

// ============================================================================
// BROWSER PERSISTENCE (FileSystemFileHandle in IndexedDB) — Chromium-only
// ============================================================================
// In Electron, persistence is handled by main.js. In Chromium browsers we save the
// FileSystemFileHandle and the photo-folder DirectoryHandle to IndexedDB so we can
// restore them on next visit (subject to the user re-granting permission).
const IDB_NAME='sukupuu-v1', IDB_STORE='handles';
function _idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await _idb();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readonly');const r=t.objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await _idb();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const db=await _idb();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

async function tryRestoreLastSession(){
  if (window.electronAPI) return;            // Electron handles its own restore
  if (!('showOpenFilePicker' in window)) return;  // Safari etc. can't persist handles
  try {
    const fileHandle = await idbGet('lastFile');
    const dirHandle  = await idbGet('photoDir');
    if (!fileHandle) return;
    // Permission may need re-granting on each session
    const fp = await fileHandle.queryPermission({mode:'read'});
    if (fp === 'granted'){
      const file = await fileHandle.getFile();
      const text = await file.text();
      loadXml(text, file.name);
      state.fileHandle = fileHandle;
    } else {
      // Show a lightweight prompt — clicking re-grants permission
      const banner = document.createElement('div');
      banner.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);z-index:200;display:flex;gap:10px;align-items:center';
      banner.innerHTML=`<span>${escapeHtml(LANG==='fi'?'Avataanko viimeinen tiedosto':'Reopen last file')}: <b>${escapeHtml(fileHandle.name)}</b>?</span><button id="rb-yes" class="primary">${escapeHtml(LANG==='fi'?'Avaa':'Open')}</button><button id="rb-no">${escapeHtml(LANG==='fi'?'Ei':'No')}</button>`;
      document.body.appendChild(banner);
      banner.querySelector('#rb-yes').onclick = async () => {
        banner.remove();
        const ok = (await fileHandle.requestPermission({mode:'read'})) === 'granted';
        if (!ok) { idbDel('lastFile'); return; }
        const file = await fileHandle.getFile();
        const text = await file.text();
        loadXml(text, file.name);
        state.fileHandle = fileHandle;
        await tryRestorePhotoDir(dirHandle);
        renderEditor();
      };
      banner.querySelector('#rb-no').onclick = () => { banner.remove(); idbDel('lastFile'); idbDel('photoDir'); };
      return;
    }
    await tryRestorePhotoDir(dirHandle);
    renderEditor();
  } catch(e){ console.warn('Restore failed', e); }
}
async function tryRestorePhotoDir(dirHandle){
  if (!dirHandle) return;
  try {
    const dp = await dirHandle.queryPermission({mode:'read'});
    if (dp === 'granted') state.photoDirHandle = dirHandle;
  } catch {}
}
// Hook into existing openFile/saveFile to persist handles after success
const _origLoadXml = loadXml;
loadXml = function(text, name){
  _origLoadXml(text, name);
  if (state.fileHandle && state.fileHandle.queryPermission){ idbSet('lastFile', state.fileHandle).catch(()=>{}); }
};
const _origPickPhotoFolder = pickPhotoFolder;
pickPhotoFolder = async function(){
  await _origPickPhotoFolder();
  if (state.photoDirHandle) idbSet('photoDir', state.photoDirHandle).catch(()=>{});
};
// Also persist when saveFile assigns a new handle
const _origSaveFile = saveFile;
saveFile = async function(){
  await _origSaveFile.apply(null, arguments);
  if (state.fileHandle && state.fileHandle.queryPermission){ idbSet('lastFile', state.fileHandle).catch(()=>{}); }
};
// Run restore after init
setTimeout(() => tryRestoreLastSession(), 0);
